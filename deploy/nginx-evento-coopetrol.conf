# Nginx: publica el sitio por HTTPS y reenvía al servidor Node en 127.0.0.1:3000.
# Copiar a /etc/nginx/sites-available/evento-coopetrol y crear el enlace en sites-enabled.
# deploy/configurar_nginx.sh reemplaza DOMINIO_EVENTO por el dominio real y valida con nginx -t antes de recargar.

limit_req_zone $binary_remote_addr zone=evento_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name DOMINIO_EVENTO;

    # Validación de certbot (Let's Encrypt) y redirección a HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # Sin HTTP/2: en Nginx < 1.25 activarlo en el puerto 443 lo activaría también para los demás sitios del servidor.
    server_name DOMINIO_EVENTO;

    # Certificado: rutas de certbot. Si Coopetrol tiene su propio certificado, cambie estas dos líneas.
    ssl_certificate     /etc/letsencrypt/live/DOMINIO_EVENTO/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMINIO_EVENTO/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # Soporte de pago de hasta 5 MB y bases de asociados de hasta 20 MB (viajan en base64, +33 %).
    client_max_body_size 30m;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;

    # El service worker debe revalidarse siempre para que las actualizaciones lleguen a los navegadores.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        proxy_pass http://127.0.0.1:3000;
    }

    # Opcional: limitar el panel de administración a la red de Coopetrol (descomente y ajuste los rangos).
    # location ~ ^/(admin\.html|admin\.js|api/admin/) {
    #     allow 10.0.0.0/8;
    #     allow 192.168.0.0/16;
    #     deny all;
    #     proxy_pass http://127.0.0.1:3000;
    # }

    location /api/ {
        limit_req zone=evento_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
